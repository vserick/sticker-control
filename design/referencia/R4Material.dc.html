<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recorte — Novo / Editar material</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #EEF0EC; color: #17181B; font-family: 'Instrument Sans', system-ui, sans-serif; overflow: hidden; box-sizing: border-box">

  <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px">
    <button type="button" aria-label="Voltar" style="width: 48px; height: 48px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #17181B; padding: 0; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; flex: 1; font-family: 'Schibsted Grotesk', sans-serif; font-size: 21px; line-height: 28px; font-weight: 800; letter-spacing: -0.025em">{{titulo}}</h1>
    <sc-if value="{{editando}}" hint-placeholder-val="{{ false }}">
      <button type="button" aria-label="Excluir" style="width: 48px; height: 48px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #B3261E; padding: 0; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
      </button>
    </sc-if>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label style="display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; min-height: 72px; box-sizing: border-box; background: #ffffff; border: 1px solid #CDD0C9; border-radius: 12px; cursor: text; {{nomeCell}}">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; {{nomeRotulo}}">Nome do material</span>
        <span style="display: flex; align-items: center; gap: 1px">
          <input type="text" value="{{nome}}" size="18" style="flex: 0 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font-family: inherit; font-size: 18px; line-height: 30px; font-weight: 600; color: #17181B">
          <sc-if value="{{cursorNome}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 1.5px; height: 22px; background: #17181B"></span></sc-if>
        </span>
      </label>
      <sc-if value="{{temErroNome}}" hint-placeholder-val="{{ false }}"><p style="margin: 0 4px 0 16px; font-size: 12px; line-height: 16px; font-weight: 600; color: #B3261E">{{erroNome}}</p></sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label style="display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; min-height: 72px; box-sizing: border-box; background: #ffffff; border: 1px solid #CDD0C9; border-radius: 12px; cursor: text; {{precoCell}}">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; {{precoRotulo}}">Preço por metro</span>
        <span style="display: flex; align-items: baseline; gap: 6px">
          <span style="font-size: 15px; font-weight: 600; color: #5A5E66">R$</span>
          <input type="text" inputmode="decimal" value="{{preco}}" style="width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font-family: 'Schibsted Grotesk', sans-serif; font-size: 26px; line-height: 34px; font-weight: 600; color: #17181B; font-variant-numeric: tabular-nums">
          <span style="font-size: 15px; font-weight: 600; color: #5A5E66; white-space: nowrap">/ m</span>
        </span>
      </label>
      <sc-if value="{{temErroPreco}}" hint-placeholder-val="{{ false }}"><p style="margin: 0 4px 0 16px; font-size: 12px; line-height: 16px; font-weight: 600; color: #B3261E">{{erroPreco}}</p></sc-if>
    </div>

    <p style="margin: 0 4px; display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: #4A4E55">
      <svg width="10" height="16" viewBox="0 0 10 16" aria-hidden="true"><path d="M1 1h8M1 15h8M5 1v14M2.5 4 5 1l2.5 3M2.5 12 5 15l2.5-3" fill="none" stroke="#5A5E66" stroke-width="1.2"></path></svg>
      Largura fixa: 1,10 m.
    </p>

    <button type="button" style="margin-top: 8px; height: 52px; border: 0; border-radius: 12px; background: #17181B; color: #ffffff; font-family: 'Schibsted Grotesk', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer">Salvar</button>
  </main>

  <sc-if value="{{teclado}}" hint-placeholder-val="{{ false }}">
    <div style="flex-shrink: 0">
      <dc-import name="RTeclado" tipo="texto" hint-size="390px,250px"></dc-import>
    </div>
  </sc-if>

  <sc-if value="{{excluir}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 27, 0.48)"></div>
    <div role="alertdialog" aria-modal="true" aria-labelledby="r4-t" aria-describedby="r4-d" style="position: absolute; left: 24px; right: 24px; top: 290px; background: #ffffff; border-radius: 20px; padding: 24px 24px 18px; box-shadow: 0 18px 40px rgba(23, 24, 27, 0.3); display: flex; flex-direction: column; gap: 12px">
      <h2 id="r4-t" style="margin: 0; font-family: 'Schibsted Grotesk', sans-serif; font-size: 22px; line-height: 28px; font-weight: 800; letter-spacing: -0.03em">Excluir material?</h2>
      <p id="r4-d" style="margin: 0; font-size: 15px; line-height: 22px; color: #4A4E55">Orçamentos já salvos com "Vinil Branco" não são alterados.</p>
      <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px">
        <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: transparent; color: #17181B; font-family: 'Schibsted Grotesk', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Cancelar</button>
        <button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #B3261E; color: #ffffff; font-family: 'Schibsted Grotesk', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Excluir</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","options":["novo","validacao","repetido","teclado","editar","excluir"],"default":"novo"},"brand":{"editor":"color","default":"#C2185B","section":"Marca da empresa","options":["#C2185B","#F2C200","#6D28D9","#1F6F5C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  hx(h) { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join(''); var n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  he(a) { return '#' + a.map(function (v) { var s = Math.round(Math.max(0, Math.min(255, v))).toString(16); return s.length < 2 ? '0' + s : s; }).join(''); }
  mix(a, b, t) { var x = this.hx(a), y = this.hx(b); return this.he(x.map(function (v, i) { return v + (y[i] - v) * t; })); }
  lum(h) { var c = this.hx(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  cr(a, b) { var x = this.lum(a), y = this.lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  ink(c, bg, alvo) { var t = 0, r = c; while (this.cr(r, bg) < alvo && t < 1) { t += 0.05; r = this.mix(c, '#000000', t); } return r; }
  renderVals() {
    var e = this.props.estado || 'novo';
    var brand = this.props.brand || '#C2185B';
    var linha = this.ink(brand, '#ffffff', 3), texto = this.ink(brand, '#ffffff', 4.5);
    var editando = e === 'editar' || e === 'excluir';
    var d = {
      novo: ['', '', '', ''],
      validacao: ['', '', 'Informe o nome.', 'Informe um valor válido, ex.: 50,00.'],
      repetido: ['Vinil Branco', '50,00', 'Já existe um material com esse nome.', ''],
      teclado: ['Vinil Perfur', '', '', ''],
      editar: ['Vinil Branco', '50,00', '', ''],
      excluir: ['Vinil Branco', '50,00', '', '']
    }[e];
    var erroCell = 'box-shadow: inset 0 0 0 2px #B3261E', erroRot = 'color: #B3261E';
    var foco = e === 'teclado';
    return {
      titulo: editando ? 'Editar material' : 'Novo material',
      editando: editando,
      nome: d[0], preco: d[1], erroNome: d[2], erroPreco: d[3],
      temErroNome: !!d[2], temErroPreco: !!d[3],
      nomeCell: d[2] ? erroCell : (foco ? 'box-shadow: inset 0 0 0 2px ' + linha : ''),
      nomeRotulo: d[2] ? erroRot : (foco ? 'color: ' + texto + '; font-weight: 700' : 'color: #5A5E66'),
      precoCell: d[3] ? erroCell : '',
      precoRotulo: d[3] ? erroRot : 'color: #5A5E66',
      cursorNome: foco,
      teclado: foco, excluir: e === 'excluir'
    };
  }
}
</script>
</body>
</html>
