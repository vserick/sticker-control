<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Recorte — Orçamento (detalhe)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #EEF0EC; color: #17181B; font-family: 'Instrument Sans', system-ui, sans-serif; overflow: hidden; box-sizing: border-box">

  <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px">
    <button type="button" aria-label="Voltar" style="width: 48px; height: 48px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #17181B; padding: 0; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; flex: 1; font-family: 'Schibsted Grotesk', sans-serif; font-size: 21px; line-height: 28px; font-weight: 800; letter-spacing: -0.025em">Orçamento</h1>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">

    <section aria-label="Dados do orçamento" style="flex-shrink: 0; background: #ffffff; border: 1px solid #CDD0C9; border-radius: 12px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
        <svg width="40" height="40" viewBox="0 0 36 36" aria-hidden="true" style="flex-shrink: 0"><rect x="6" y="6" width="24" height="24" rx="6" fill="{{tokenFill}}"></rect><rect x="2.75" y="2.75" width="30.5" height="30.5" rx="9" fill="none" stroke="{{tokenLine}}" stroke-width="1.5" stroke-dasharray="3.5 3"></rect></svg>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Schibsted Grotesk', sans-serif; font-size: 19px; line-height: 24px; font-weight: 700; letter-spacing: -0.015em">{{titulo}}</span>
          <span style="font-size: 13px; line-height: 17px; color: #5A5E66; font-variant-numeric: tabular-nums">{{data}} · {{tipo}}</span>
        </div>
      </div>
      <dl style="margin: 0; border-top: 1px solid #E4E6E1">
        <sc-for list="{{linhas}}" as="l" hint-placeholder-count="3">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 11px 16px; {{l.borda}}">
            <dt style="font-size: 14px; color: #4A4E55">{{l.r}}</dt>
            <dd style="margin: 0; text-align: right; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{l.v}}</dd>
          </div>
        </sc-for>
      </dl>
    </section>

    <section aria-label="Resultado" style="flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
      <dl style="margin: 0; padding: 12px 16px; background: #ffffff; border: 1px solid #CDD0C9; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px">
        <div style="display: flex; align-items: baseline; gap: 8px"><dt style="color: #4A4E55">Custo</dt><span aria-hidden="true" style="flex: 1; border-bottom: 1.5px dotted #B4B8B0"></span><dd style="margin: 0; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 600; font-variant-numeric: tabular-nums">{{custo}}</dd></div>
        <div style="display: flex; align-items: baseline; gap: 8px"><dt style="color: #4A4E55">Acréscimo ({{pct}}%)</dt><span aria-hidden="true" style="flex: 1; border-bottom: 1.5px dotted #B4B8B0"></span><dd style="margin: 0; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 600; font-variant-numeric: tabular-nums">{{acrValor}}</dd></div>
      </dl>
      <div style="position: relative; margin: 5px; padding: 14px 18px; border-radius: 14px; background: {{brand}}; color: {{onBrand}}; outline: 1.5px dashed #17181B; outline-offset: 4px; box-shadow: 0 6px 14px rgba(23, 24, 27, 0.18); display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <span style="font-size: 13px; line-height: 18px; font-weight: 700">Preço final</span>
        <span style="font-family: 'Schibsted Grotesk', sans-serif; font-size: 38px; line-height: 46px; font-weight: 800; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; padding-right: 10px">{{final}}</span>
        <span aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 26px; height: 26px; background: #EEF0EC; clip-path: polygon(0 0, 100% 0, 100% 100%); border-top-right-radius: 14px"></span>
        <span aria-hidden="true" style="position: absolute; right: 0; top: 0; width: 26px; height: 26px; background: {{dobra}}; clip-path: polygon(0 0, 100% 100%, 0 100%); border-bottom-left-radius: 5px"></span>
      </div>
    </section>

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #17181B; color: #ffffff; font-family: 'Schibsted Grotesk', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20 21 12 4 4l2 8-2 8z"></path><path d="M6 12h7"></path></svg>
        Enviar por WhatsApp
      </button>
      <button type="button" style="height: 52px; border: 1px solid #17181B; border-radius: 12px; background: #ffffff; color: #17181B; font-family: 'Schibsted Grotesk', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg>
        Duplicar
      </button>
      <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: transparent; color: #B3261E; font-family: 'Schibsted Grotesk', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
        Excluir
      </button>
    </div>
  </main>

  <sc-if value="{{excluir}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 27, 0.48)"></div>
    <div role="alertdialog" aria-modal="true" aria-labelledby="r3-t" aria-describedby="r3-d" style="position: absolute; left: 24px; right: 24px; top: 300px; background: #ffffff; border-radius: 20px; padding: 24px 24px 18px; box-shadow: 0 18px 40px rgba(23, 24, 27, 0.3); display: flex; flex-direction: column; gap: 12px">
      <h2 id="r3-t" style="margin: 0; font-family: 'Schibsted Grotesk', sans-serif; font-size: 22px; line-height: 28px; font-weight: 800; letter-spacing: -0.03em">Excluir orçamento?</h2>
      <p id="r3-d" style="margin: 0; font-size: 15px; line-height: 22px; color: #4A4E55">Essa ação não pode ser desfeita.</p>
      <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px">
        <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: transparent; color: #17181B; font-family: 'Schibsted Grotesk', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Cancelar</button>
        <button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #B3261E; color: #ffffff; font-family: 'Schibsted Grotesk', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Excluir</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{falha}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 24px; padding: 14px 16px; background: #17181B; color: #ffffff; border-radius: 12px; box-shadow: 0 6px 16px rgba(23, 24, 27, 0.25); display: flex; align-items: center; gap: 12px; font-size: 14px; line-height: 20px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2C94C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3.5 2.5 20h19L12 3.5z"></path><path d="M12 10v4.5M12 17.2v.3"></path></svg>
      Não foi possível abrir o WhatsApp.
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","options":["propria","terceirizada","excluir","falhaWhats"],"default":"propria"},"brand":{"editor":"color","default":"#C2185B","section":"Marca da empresa","options":["#C2185B","#F2C200","#6D28D9","#1F6F5C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  hx(h) { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join(''); var n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  he(a) { return '#' + a.map(function (v) { var s = Math.round(Math.max(0, Math.min(255, v))).toString(16); return s.length < 2 ? '0' + s : s; }).join(''); }
  mix(a, b, t) { var x = this.hx(a), y = this.hx(b); return this.he(x.map(function (v, i) { return v + (y[i] - v) * t; })); }
  lum(h) { var c = this.hx(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  cr(a, b) { var x = this.lum(a), y = this.lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  ink(c, bg, alvo) { var t = 0, r = c; while (this.cr(r, bg) < alvo && t < 1) { t += 0.05; r = this.mix(c, '#000000', t); } return r; }
  renderVals() {
    var e = this.props.estado || 'propria';
    var brand = this.props.brand || '#C2185B';
    var terc = e === 'terceirizada';
    var linhas = terc
      ? [['Largura', '1,20 m'], ['Fornecedor', 'R$ 80,00']]
      : [['Material', 'Vinil Branco · R$ 50,00 / m'], ['Largura', '1,00 m'], ['Comprimento', '2,00 m']];
    return {
      brand: brand,
      onBrand: this.cr(brand, '#ffffff') >= this.cr(brand, '#17181B') ? '#ffffff' : '#17181B',
      dobra: this.mix(brand, '#ffffff', 0.5),
      tokenFill: terc ? 'transparent' : this.mix(brand, '#ffffff', 0.72),
      tokenLine: terc ? '#8A8E95' : this.ink(brand, '#ffffff', 3),
      titulo: terc ? 'Adesivo de vitrine' : 'Adesivo de porta',
      data: terc ? '19/10/2026 14:32' : '19/10/2026 10:05',
      tipo: terc ? 'Terceirizada' : 'Própria',
      linhas: linhas.map(function (l, i) { return { r: l[0], v: l[1], borda: i === 0 ? '' : 'border-top: 1px solid #E4E6E1' }; }),
      custo: terc ? 'R$ 80,00' : 'R$ 100,00', pct: '50', acrValor: terc ? 'R$ 40,00' : 'R$ 50,00', final: terc ? 'R$ 120,00' : 'R$ 150,00',
      excluir: e === 'excluir', falha: e === 'falhaWhats'
    };
  }
}
</script>
</body>
</html>
